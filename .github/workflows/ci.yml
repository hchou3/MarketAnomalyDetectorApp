name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies from lock file
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Run tests (no DB required)
        run: uv run pytest -m "not db and not network"

  test-db:
    name: DB tests (Python 3.13)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mad_test
          POSTGRES_USER: mad
          POSTGRES_PASSWORD: mad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mad -d mad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies from lock file
        run: uv sync --frozen --extra dev --python 3.13

      - name: Run DB tests
        env:
          MAD_TEST_DATABASE_URL: postgresql+psycopg://mad:mad@localhost:5432/mad_test
        run: uv run pytest -m db -v
