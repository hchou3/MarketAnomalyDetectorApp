- id: gbp_usd_fred
  name: GBP/USD history proxy — FRED DEXUSUK
  reference_instrument: gbp_usd
  asset_class: fx
  groups: [fx]
  units: price
  quote: USD per GBP; higher = stronger GBP
  native_frequency: daily
  sources:
    - provider: fred
      symbol: DEXUSUK
      priority: 1
      fidelity: exact
      publication_lag_days: 10
      notes: >
        H.10 release. FRED DEXUSUK carries USD/GBP data back to 1971-01-04,
        before Yahoo Finance's reliable start of ~2003-12-01. Use as
        fallback_instrument_id in FeatureSpec entries for gbp_usd to extend
        history before Yahoo's start. The gbp_usd instrument also has FRED at
        priority 2 for live-ingestion fallback; this proxy exists specifically
        for the FeatureSpec cross-instrument splice path.
  valid_from: null
  valid_to: null
  notes: >
    Proxy for gbp_usd. Will fill pre-2003 history once FRED is backfilled.
    Use as fallback_instrument_id in FeatureSpec entries for gbp_usd features.

