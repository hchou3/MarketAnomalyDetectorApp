# Instrument registry for Market Anomaly Detector
#
# Every instrument the app uses has one canonical entry here.
# The bloomberg_ews source (priority 99) is historical reference only; it is
# never used for live ingestion.  Live sources are tried in priority order.
#
# Field notes:
#   fidelity: exact | proxy | unavailable
#   unavailable sources must not carry a symbol field.
#   revised: true requires a notes field explaining how revisions are handled.
#
# Sections: commodities · fx · volatility · us_rates · european_rates ·
#           japan_rates · uk_rates · credit · equity_index · macro_index ·
#           stress_series

# ── Commodities ────────────────────────────────────────────────────────────────

- id: gold
  name: Gold spot (Bloomberg BGN)
  asset_class: commodity
  groups: [safe_haven_candidate, commodity]
  units: price
  quote: USD per troy oz
  native_frequency: daily
  sources:
    - provider: yahoo
      symbol: "GC=F"
      priority: 1
      fidelity: exact
      notes: >
        Front-month gold futures; tracks spot within ~$5. Weekly-change corr
        vs EWS XAU BGNL = 0.986 (1077 weeks), above the 0.98 exact threshold.
    - provider: bloomberg_ews
      symbol: "XAU BGNL"
      priority: 99
      fidelity: exact
  valid_from: null
  valid_to: null
  notes: Bloomberg BGN spot is the reference; GC=F futures are the best public proxy.

- id: wti_front
  name: WTI crude oil, front-month futures (Bloomberg Cl1)
  asset_class: commodity
  groups: [commodity]
  units: price
  quote: USD per barrel
  native_frequency: daily
  allow_negative: true
  sources:
    - provider: yahoo
      symbol: "CL=F"
      priority: 1
      fidelity: exact
      notes: Same Bloomberg Cl1 contract.
    - provider: fred
      symbol: DCOILWTICO
      priority: 2
      fidelity: proxy
      notes: Weekly EIA Cushing spot price, not futures; use as fallback only.
    - provider: bloomberg_ews
      symbol: Cl1
      priority: 99
      fidelity: exact
  valid_from: null
  valid_to: null
  notes: WTI front-month futures can briefly go negative at contract roll (April 2020).

