- id: usd_jpy
  name: US dollar / Japanese yen
  asset_class: fx
  groups: [safe_haven_candidate, fx]
  units: price
  quote: JPY per USD; higher = weaker yen
  native_frequency: daily
  sources:
    - provider: yahoo
      symbol: "JPY=X"
      priority: 1
      fidelity: exact
    - provider: fred
      symbol: DEXJPUS
      priority: 2
      fidelity: exact
      publication_lag_days: 10
      notes: >
        H.10 release; ALFRED-verified typical lag is 1-3 calendar days but 10
        is used as a conservative floor to guarantee no look-ahead bias in
        backtests (holiday weekends can extend the gap). Run
        scripts/record_fixtures.py with FRED_API_KEY to measure actual lags.
    - provider: bloomberg_ews
      symbol: JPY
      priority: 99
      fidelity: exact
  valid_from: null
  valid_to: null
  notes: ""

