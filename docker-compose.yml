services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mad
      POSTGRES_USER: mad
      POSTGRES_PASSWORD: mad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mad -d mad"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
