[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-anomaly-detector"
version = "0.1.0"
description = "Detects market-wide stress regimes from macro instruments"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn>=1.6",
    "shap",
    "joblib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "nbstripout",
]

[project.scripts]
mad-train = "market_anomaly_detector.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
