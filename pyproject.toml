[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-anomaly-detector"
version = "0.1.0"
description = "Detects market-wide stress regimes from macro instruments"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn>=1.6",
    "shap",
    "joblib",
    "pydantic>=2",
    "pyyaml",
    "sqlalchemy>=2",
    "alembic>=1.20.0",
    "psycopg[binary]>=3",
    "yfinance>=1.0",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "nbstripout",
]

[project.scripts]
mad-train = "market_anomaly_detector.train:main"
mad-backtest = "market_anomaly_detector.backtest:main"
mad-data = "market_anomaly_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# Exact versions the published metrics were measured with (keep in sync with requirements.txt).
constraint-dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.3.1",
    "scikit-learn==1.6.1",
    "shap==0.50.0",
    "joblib==1.5.1",
]

[tool.ruff]
line-length = 100
exclude = ["notebooks/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Long f-strings in the CLI report; split them when backtest.py is reworked in Phase 2.
"src/market_anomaly_detector/backtest.py" = ["E501"]
# Inline fixture dicts are clearer when kept on one line even if slightly long.
"tests/test_registry.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a live Postgres database (set MAD_TEST_DATABASE_URL)",
    "network: requires live internet access (skipped in offline CI)",
]
